# Mock crew journal: free-text entries and the reading a language model would return for each.
# No language model runs in the demo; `reader: mock` is carried into the dashboard data.
# region / side: the body area a pain or symptom report refers to (see BODY_REGIONS in contract.py).
# effect: what the entry could plausibly do to vital signs. These readings are the team's own wording,
# not taken from the research notes; treat them as illustrations. Entries never change the simulated vitals,
# except the schedule shift, which is tied to the simulated shared event (accounted: true).
personal:
