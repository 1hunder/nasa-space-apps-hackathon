<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space-Normal — pitch</title>
<style>
/* ================================================================
   SPACE-NORMAL · PITCH DECK (offline, single file)
   Keys: → Space PageDown click = next · ← PageUp = back
         F fullscreen · T timer · R reset timer · P presenter · 1–8 jump
   All texts live in the CONFIG object at the top of the <script>.
   ================================================================ */
:root{
  --bg:#000;
  --ink:#f2f4f7;
  --dim:rgba(242,244,247,.62);
  --faint:rgba(242,244,247,.38);
  --teal:#38e1d4;
  --teal-dim:rgba(56,225,212,.18);
  --mars:#e0703a;
  --red:#ff4d4d;
  --amber:#ffb547;
  --font:"Helvetica Neue", Helvetica, -apple-system, "Segoe UI", Arial, sans-serif;
  --s:1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;cursor:default;-webkit-font-smoothing:antialiased}
canvas#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}

/* glows (generated, no images) */
.glow{position:fixed;border-radius:50%;pointer-events:none;z-index:1;filter:blur(40px);
  transition:left 1.8s cubic-bezier(.4,0,.2,1), top 1.8s cubic-bezier(.4,0,.2,1), width 1.8s, height 1.8s, opacity 1.8s}
.glow.mars{background:radial-gradient(circle, rgba(224,112,58,.55) 0%, rgba(224,112,58,.18) 38%, rgba(224,112,58,0) 70%)}
.glow.teal{background:radial-gradient(circle, rgba(56,225,212,.35) 0%, rgba(56,225,212,.10) 40%, rgba(56,225,212,0) 70%)}

/* stage: fixed 1600×900 logical canvas scaled to fit */
.stage{position:fixed;left:50%;top:50%;width:1600px;height:900px;z-index:3;
  transform:translate(-50%,-50%) scale(var(--s));transform-origin:center center}
.scene{position:absolute;inset:0;padding:96px 110px 92px;opacity:0;pointer-events:none;
  transform:scale(.955);filter:blur(8px);
  transition:opacity .9s cubic-bezier(.4,0,.2,1), transform 1.1s cubic-bezier(.2,.7,.2,1), filter .9s}
.scene.active{opacity:1;transform:none;filter:none;pointer-events:auto}
.scene.past{opacity:0;transform:scale(1.07);filter:blur(10px)}

/* staggered beats */
[data-beat]{opacity:0;transform:translateY(16px);
  transition:opacity .75s ease, transform .9s cubic-bezier(.2,.7,.2,1);
  transition-delay:calc(var(--i,0) * 160ms + 120ms)}
[data-beat].on{opacity:1;transform:none}

/* type */
.kicker{font-size:20px;letter-spacing:.42em;text-transform:uppercase;color:var(--teal);font-weight:500}
.title{font-size:54px;line-height:1.08;letter-spacing:.06em;text-transform:uppercase;font-weight:500;margin-top:14px}
.sub{font-size:24px;color:var(--dim);margin-top:14px;letter-spacing:.02em}
.small{font-size:17px;color:var(--dim);letter-spacing:.02em}
.tag{display:inline-block;font-size:13px;letter-spacing:.22em;text-transform:uppercase;padding:5px 10px;border:1px solid currentColor;border-radius:3px}
.tag.syn{color:var(--amber)}
.tag.ph{color:var(--amber);font-size:11px;padding:2px 6px;margin-left:8px;vertical-align:middle}
.foot{position:absolute;left:110px;right:110px;bottom:58px;font-size:14px;line-height:1.5;color:rgba(242,244,247,.46);letter-spacing:.03em}
.foot b{color:var(--dim);font-weight:500}
.teal{color:var(--teal)} .mars{color:var(--mars)} .red{color:var(--red)} .amber{color:var(--amber)}

/* film overlays */
.grain{position:fixed;inset:-50%;z-index:6;pointer-events:none;opacity:.07;mix-blend-mode:screen;animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.vignette{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.72) 100%)}
.bar{position:fixed;left:0;right:0;height:4.4vh;background:#000;z-index:7}
.bar.top{top:0}.bar.bot{bottom:0}
.progress{position:fixed;left:0;bottom:0;height:2px;background:var(--teal);opacity:.55;z-index:8;transition:width .9s cubic-bezier(.4,0,.2,1)}
#timer{position:fixed;top:1.1vh;right:1.4vw;z-index:9;font:500 15px/1 var(--font);letter-spacing:.12em;color:var(--dim);display:none;font-variant-numeric:tabular-nums}
#timer.warn{color:var(--amber)} #timer.over{color:var(--red)}
#hint{position:fixed;top:1.1vh;left:1.4vw;z-index:9;font:13px/1 var(--font);letter-spacing:.1em;color:var(--faint);transition:opacity 1.5s}

/* ---------- S1 hook ---------- */
.hook{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center}
.temp{font-size:230px;font-weight:200;letter-spacing:-.02em;line-height:1;margin-top:26px;font-variant-numeric:tabular-nums;transition:color .6s, text-shadow .6s}
.temp small{font-size:80px;font-weight:300;margin-left:10px;color:var(--dim)}
.temp.alarm{color:#ff6b6b;text-shadow:0 0 50px rgba(255,77,77,.45)}
.hero-line{font-size:44px;letter-spacing:.14em;text-transform:uppercase;margin-top:28px;font-weight:400}
.alarm-box{margin-top:30px;border:2px solid var(--red);color:var(--red);padding:14px 30px;border-radius:4px;
  font-size:34px;letter-spacing:.3em;text-transform:uppercase;background:rgba(255,77,77,.08)}
.alarm-box.on{animation:blink 1.1s ease-in-out 3}
.alarm-box span{display:block;font-size:16px;letter-spacing:.18em;color:rgba(255,120,120,.8);margin-top:6px}
@keyframes blink{0%,100%{box-shadow:0 0 0 rgba(255,77,77,0)}50%{box-shadow:0 0 60px rgba(255,77,77,.55);background:rgba(255,77,77,.22)}}

/* ---------- S2 problem ---------- */
.prob{display:grid;grid-template-columns:1fr;height:100%}
.link-svg{width:100%;height:300px;margin-top:28px}
.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;margin-top:30px}
.item{border-top:1px solid rgba(56,225,212,.45);padding-top:18px}
.item .big{font-size:64px;font-weight:300;letter-spacing:.02em}
.item .lbl{font-size:23px;color:var(--dim);margin-top:8px;line-height:1.35}

/* ---------- S3 chart ---------- */
.chart-wrap{display:grid;grid-template-columns:1000px 1fr;gap:34px;margin-top:22px;align-items:start}
.chart{width:1000px;height:540px;overflow:visible}
.chart text{font-family:var(--font)}
.verdict{border:1px solid rgba(242,244,247,.18);background:rgba(8,14,20,.55);border-radius:6px;padding:18px 20px;margin-bottom:18px;backdrop-filter:blur(6px)}
.verdict h4{font-size:22px;font-weight:500;letter-spacing:.08em;margin-bottom:12px}
.verdict .row{display:flex;justify-content:space-between;gap:14px;font-size:17px;padding:7px 0;border-top:1px solid rgba(242,244,247,.08)}
.verdict .row .k{color:var(--dim)}
.syn-label{position:absolute;right:110px;top:104px}

/* ---------- S4 product ---------- */
.prod{display:grid;grid-template-columns:780px 1fr;gap:60px;margin-top:60px;align-items:start}
.card{border:1px solid rgba(56,225,212,.55);border-radius:8px;background:linear-gradient(180deg, rgba(56,225,212,.10), rgba(56,225,212,.03));
  box-shadow:0 0 60px rgba(56,225,212,.15), inset 0 0 40px rgba(56,225,212,.05);padding:26px 30px;position:relative;overflow:hidden}
.card:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(56,225,212,.05) 0 1px, transparent 1px 4px);pointer-events:none}
.card .hdr{display:flex;justify-content:space-between;font-size:14px;letter-spacing:.24em;color:var(--teal);text-transform:uppercase;padding-bottom:14px;border-bottom:1px solid rgba(56,225,212,.3)}
.card .r{padding:18px 0 14px;border-bottom:1px solid rgba(56,225,212,.14)}
.card .r:last-child{border-bottom:0}
.card .r .h{font-size:15px;letter-spacing:.28em;font-weight:600}
.card .r .t{font-size:26px;margin-top:8px;line-height:1.35}
.users .u{display:flex;gap:18px;align-items:flex-start;padding:18px 0;border-bottom:1px solid rgba(242,244,247,.1)}
.users .ic{width:46px;height:46px;flex:0 0 46px;border:1px solid var(--teal);border-radius:50%;display:grid;place-items:center;color:var(--teal);font-size:20px}
.users .n{font-size:27px}
.users .d{font-size:20px;color:var(--dim);margin-top:4px}
.llm{margin-top:30px;font-size:21px;color:var(--amber);letter-spacing:.03em}

/* ---------- S5 proof ---------- */
.proof{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px;margin-top:60px}
.pc{border:1px solid rgba(242,244,247,.16);border-radius:6px;padding:36px 32px;min-height:270px;background:rgba(8,14,20,.5)}
.pc .big{font-size:64px;white-space:nowrap;font-weight:300;letter-spacing:.04em;color:var(--teal);line-height:1}
.pc .lbl{font-size:25px;margin-top:20px;line-height:1.4}
.pc .lbl .small{display:block;margin-top:10px;font-size:19px}
.limit{margin-top:40px;border-left:3px solid var(--amber);padding:16px 24px;font-size:27px;line-height:1.4;background:rgba(255,181,71,.06)}
.headline-x{display:none} /* PLAN A: show when docs/claims.md has the headline number */

/* ---------- S6 difference ---------- */
.diff{display:grid;grid-template-columns:minmax(0,1fr) 270px minmax(0,1fr);gap:0;margin-top:80px;align-items:center}
.col{border-radius:8px;padding:36px 36px;min-height:340px}
.col.sn{border:1px solid rgba(56,225,212,.6);background:rgba(56,225,212,.07);box-shadow:0 0 70px rgba(56,225,212,.12)}
.col.cmo{border:1px solid rgba(242,244,247,.22);background:rgba(242,244,247,.03)}
.col .who{font-size:15px;letter-spacing:.28em;text-transform:uppercase}
.col .q{font-size:46px;line-height:1.2;margin-top:18px;font-weight:300}
.col .w{font-size:21px;color:var(--dim);margin-top:18px;line-height:1.45}
.arrow{text-align:center;color:var(--teal);font-size:19px;letter-spacing:.06em;line-height:1.45;padding:0 14px}
.arrow svg{width:220px;height:40px;display:block;margin:8px auto}
.prior{margin-top:44px;font-size:21px;color:var(--dim);line-height:1.5}

/* ---------- S7 close ---------- */
.close{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center}
.callback{font-size:38px;letter-spacing:.12em;text-transform:uppercase;font-weight:300}
.callback b{font-weight:500;color:var(--teal)}
.wordmark{font-size:92px;letter-spacing:.16em;font-weight:600;margin-top:46px}
.beat-line{width:900px;height:90px;margin-top:4px}
.tagline{font-size:30px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:8px}
.url{font-size:20px;letter-spacing:.12em;color:var(--teal);margin-top:28px}

/* ---------- S8 sources ---------- */
.src{columns:2;column-gap:56px;margin-top:26px;font-size:14px;line-height:1.45;color:var(--dim)}
.src li{break-inside:avoid;margin:0 0 9px 18px}
.src li b{color:var(--ink);font-weight:500}
.src a{color:var(--teal);text-decoration:none;word-break:break-all}

/* draw-on helpers */
.draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.6s cubic-bezier(.4,0,.2,1) .2s}
.on .draw,.draw.on{stroke-dashoffset:0}

@media (prefers-reduced-motion: reduce){
  *,*:before,*:after{transition-duration:0s!important;transition-delay:0s!important;animation:none!important}
  .scene{filter:none!important}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="glow mars" id="glowMars"></div>
<div class="glow teal" id="glowTeal"></div>
<div class="stage" id="stage"></div>
<div class="vignette"></div>
<div class="grain" id="grain"></div>
<div class="bar top"></div><div class="bar bot"></div>
<div class="progress" id="progress"></div>
<div id="timer">0:00 / 2:30</div>
<div id="hint">→ dalej · ← wstecz · F pełny ekran · P notatki · T timer</div>

<script>

   beats: number of extra clicks inside the slide before moving on.
   notes: Polish speaker notes (SZKIC = draft). {HERO} is substituted.

const HERO = "Vega";
const APP_URL = "{APP_URL}";
const TOTAL = 150; // 2:30

const CH = { W:1000, H:540, x0:90, x1:960, y0:470, y1:30, dMax:120, tMin:36.0, tMax:38.4 };
const X = d => CH.x0 + (d/CH.dMax)*(CH.x1-CH.x0);
const Y = t => CH.y0 - ((t-CH.tMin)/(CH.tMax-CH.tMin))*(CH.y0-CH.y1);
const center = d => 36.7 + 1.1*(1-Math.exp(-d/24));
const HALF = 0.25;
function corridorPaths(){
  let up=[], lo=[], mid=[];
  for(let d=0; d<=CH.dMax; d+=2){ up.push([X(d),Y(center(d)+HALF)]); lo.push([X(d),Y(center(d)-HALF)]); mid.push([X(d),Y(center(d))]); }
  const band = "M"+up.map(p=>p.join(",")).join(" L")+" L"+lo.reverse().map(p=>p.join(",")).join(" L")+" Z";
  const line = "M"+mid.map(p=>p.join(",")).join(" L");
  let dots="";
  for(let d=1; d<80; d+=2){ const n=Math.sin(d*12.9898)*43758.5453; const r=(n-Math.floor(n)-.5)*0.28; dots+=`<circle cx="${X(d)}" cy="${Y(center(d)+r)}" r="3" fill="#38e1d4" opacity=".55"/>`; }
  return {band,line,dots};
}

/* ---------- build ---------- */
const stage = document.getElementById("stage");
S.forEach((s,i)=>{
  const sec=document.createElement("section");
  sec.className="scene"; sec.dataset.idx=i; sec.innerHTML=B[s.key](s);
  stage.appendChild(sec);
});
const scenes=[...stage.querySelectorAll(".scene")];

/* ---------- scale stage ---------- */
function fit(){ const s=Math.min(innerWidth/1600, innerHeight/900); document.documentElement.style.setProperty("--s", s); }
addEventListener("resize", fit); fit();

/* ---------- state & navigation ---------- */
let cur=0, beat=0;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function render(dir){
  scenes.forEach((sc,i)=>{
    sc.classList.toggle("active", i===cur);
    sc.classList.toggle("past", i<cur);
    sc.querySelectorAll("[data-beat]").forEach(el=>{
      const on = i===cur && +el.dataset.beat<=beat;
      el.classList.toggle("on", on);
    });
  });
  // glows
  const g=S[cur].glow;
  place(document.getElementById("glowMars"), g.mars);
  place(document.getElementById("glowTeal"), g.teal);
  document.getElementById("progress").style.width = (100*(cur)/(S.length-1))+"%";
  camTarget = {x: cur*160, y: Math.sin(cur*1.3)*60, z: 1+cur*.02};
  hooks(dir);
  try{ history.replaceState(null,"","#"+(cur+1)+"."+beat); }catch(e){}
  updatePresenter();
}
function place(el,[x,y,size]){ const px=size*innerWidth/100; el.style.width=el.style.height=px+"px"; el.style.left=(x*innerWidth/100-px/2)+"px"; el.style.top=(y*innerHeight/100-px/2)+"px"; el.style.opacity=size?1:0; }

function next(){ startTimer(); if(beat<S[cur].beats){beat++;render(1);} else if(cur<S.length-1){cur++;beat=0;render(1);} }
function prev(){ if(beat>0){beat--;render(-1);} else if(cur>0){cur--;beat=S[cur].beats;render(-1);} }
function go(i){ if(i>=0&&i<S.length){cur=i;beat=0;render(0);} }

/* ---------- per-slide animation hooks ---------- */
let tempAnim=null, corAnim=null;
function hooks(dir){
  const k=S[cur].key;
  // hook: temperature counter
  const temp=document.getElementById("temp"), alarm=document.getElementById("alarm");
  if(k==="hook"){
    const t=S[cur].text;
    if(beat===0 && dir>=0){ animateNum(temp,t.from,t.to,2400); }
    else { cancelAnimationFrame(tempAnim); setTemp(temp,t.to); }
    temp.classList.toggle("alarm", beat>=1);
    alarm.classList.toggle("on", beat>=1);
  } else { cancelAnimationFrame(tempAnim); temp.classList.remove("alarm"); }
  // chart: corridor reveal
  const rect=document.getElementById("corRect");
  if(k==="chart"){
    if(beat===3 && dir>0) revealCorridor(rect);
    else if(beat>=3) rect.setAttribute("width", CH.W);
    else { cancelAnimationFrame(corAnim); rect.setAttribute("width", 0); }
    document.getElementById("dotA").style.opacity = beat>=5 ? .45 : "";
  }
}
function setTemp(el,v){ el.innerHTML=v.toFixed(1).replace(".",",")+"<small>°C</small>"; }
function animateNum(el,a,b,ms){
  cancelAnimationFrame(tempAnim);
  if(reduce){ setTemp(el,b); return; }
  const t0=performance.now()+500;
  const step=now=>{ const p=Math.max(0,Math.min(1,(now-t0)/ms)); const e=1-Math.pow(1-p,3); setTemp(el,a+(b-a)*e); if(p<1) tempAnim=requestAnimationFrame(step); };
  setTemp(el,a); tempAnim=requestAnimationFrame(step);
}
function revealCorridor(rect){
  cancelAnimationFrame(corAnim);
  if(reduce){ rect.setAttribute("width",CH.W); return; }
  const t0=performance.now()+250, ms=2600;
  const step=now=>{ const p=Math.max(0,Math.min(1,(now-t0)/ms)); const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2; rect.setAttribute("width", CH.x0 + e*(CH.W-CH.x0)); if(p<1) corAnim=requestAnimationFrame(step); };
  rect.setAttribute("width", CH.x0); corAnim=requestAnimationFrame(step);
}

/* ---------- starfield (canvas, generated) ---------- */
const cv=document.getElementById("stars"), cx=cv.getContext("2d");
let stars=[], cam={x:0,y:0,z:1}, camTarget={x:0,y:0,z:1}, DPR=1;
function initStars(){
  DPR=Math.min(2, devicePixelRatio||1);
  cv.width=innerWidth*DPR; cv.height=innerHeight*DPR;
  stars=[]; let seed=7;
  const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  [[420,.15,.7],[200,.4,1.1],[70,.9,1.7]].forEach(([n,depth,size])=>{
    for(let i=0;i<n;i++) stars.push({x:rnd()*4000,y:rnd()*2400,d:depth,s:size*(.5+rnd()),tw:rnd()*6.28,c:rnd()<.1?"255,200,170":(rnd()<.15?"170,240,235":"235,240,255")});
  });
}
let lastT=performance.now(), drift=0;
function drawStars(now){
  const dt=Math.min(50,now-lastT); lastT=now;
  if(!reduce) drift+=dt*0.006;
  const k=reduce?1:0.025;
  cam.x+=(camTarget.x-cam.x)*k; cam.y+=(camTarget.y-cam.y)*k; cam.z+=(camTarget.z-cam.z)*k;
  const w=cv.width,h=cv.height;
  cx.fillStyle="#000"; cx.fillRect(0,0,w,h);
  for(const st of stars){
    let x=((st.x - (cam.x+drift)*st.d)%4000+4000)%4000, y=((st.y - cam.y*st.d)%2400+2400)%2400;
    x = (x/4000)*w*1.15 - w*.075; y=(y/2400)*h*1.15 - h*.075;
    // push-in: scale from center by depth
    const z=1+(cam.z-1)*st.d*3; x=w/2+(x-w/2)*z; y=h/2+(y-h/2)*z;
    const a = reduce ? .8 : (.55+.45*Math.sin(st.tw+now*0.0012*st.d*2));
    cx.fillStyle=`rgba(${st.c},${a*Math.min(1,.35+st.d)})`;
    const r=st.s*DPR*.6;
    cx.beginPath(); cx.arc(x,y,r,0,6.283); cx.fill();
  }
  requestAnimationFrame(drawStars);
}
addEventListener("resize", ()=>{ initStars(); render(0); });
initStars(); requestAnimationFrame(drawStars);

/* ---------- film grain (generated) ---------- */
(function(){ const c=document.createElement("canvas"); c.width=c.height=220; const g=c.getContext("2d"); const im=g.createImageData(220,220);
  for(let i=0;i<im.data.length;i+=4){ const v=Math.random()*255; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; }
  g.putImageData(im,0,0); document.getElementById("grain").style.backgroundImage=`url(${c.toDataURL()})`; })();

/* ---------- rehearsal timer ---------- */
let t0=null;
const timerEl=document.getElementById("timer");
const fmt=s=>{ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
function startTimer(){ if(t0===null) t0=performance.now(); }
function elapsed(){ return t0===null?0:(performance.now()-t0)/1000; }
setInterval(()=>{
  const e=elapsed();
  timerEl.textContent=fmt(e)+" / "+fmt(TOTAL);
  timerEl.classList.toggle("warn", e>=140 && e<TOTAL);
  timerEl.classList.toggle("over", e>=TOTAL);
  updatePresenter(true);
},250);

/* ---------- presenter window ----------
   Direct window reference (BroadcastChannel is unreliable for file:// pages). */
let pw=null;
function openPresenter(){
  pw=window.open("", "spacenormal-presenter", "width=900,height=640");
  if(!pw) return;
  pw.document.open();
  pw.document.write(`<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Presenter — Space-Normal</title>
  <style>body{margin:0;background:#05080b;color:#eef;font-family:${getComputedStyle(document.body).fontFamily};padding:28px 34px}
  .top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #234;padding-bottom:14px}
  #pt{font-size:56px;font-variant-numeric:tabular-nums;font-weight:300}#pt.warn{color:#ffb547}#pt.over{color:#ff4d4d}
  #ps{font-size:18px;color:#8aa;letter-spacing:.1em;text-transform:uppercase}
  #pn{font-size:30px;line-height:1.45;margin-top:22px}#pn .beat{color:#38e1d4}
  #px{margin-top:26px;font-size:18px;color:#789}#pg{font-size:18px;color:#38e1d4;margin-top:6px}
  small{color:#567}</style></head><body>
  <div class="top"><div id="ps"></div><div id="pt">0:00</div></div>
  <div id="pg"></div><div id="pn"></div><div id="px"></div>
  <p><small>→ / PageDown / Space = dalej · ← / PageUp = wstecz · R = reset timera</small></p></body></html>`);
  pw.document.close();
  pw.document.addEventListener("keydown", onKey);
  updatePresenter();
}
function updatePresenter(onlyTime){
  if(!pw || pw.closed) return;
  const d=pw.document, s=S[cur], e=elapsed();
  const pt=d.getElementById("pt"); if(!pt) return;
  pt.textContent=fmt(e)+" / "+fmt(TOTAL);
  pt.className = e>=TOTAL?"over":(e>=140?"warn":"");
  if(onlyTime) return;
  d.getElementById("ps").textContent=`Slajd ${cur+1}/${S.length} · ${s.title} · klik ${beat}/${s.beats}`;
  d.getElementById("pg").textContent= s.time ? `cel: ${fmt(s.time[0])} – ${fmt(s.time[1])}` : "poza czasem (Q&A)";
  d.getElementById("pn").innerHTML=H(s.notes).replace(/\[klik\]/g,'<span class="beat">[klik]</span>');
  d.getElementById("px").textContent= cur<S.length-1 ? "Następny: "+S[cur+1].title : "Koniec";
}

/* ---------- input ---------- */
function onKey(e){
  const k=e.key;
  if(["ArrowRight"," ","PageDown","Enter"].includes(k)){ e.preventDefault(); next(); }
  else if(["ArrowLeft","PageUp","Backspace"].includes(k)){ e.preventDefault(); prev(); }
  else if(k==="f"||k==="F"){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
  else if(k==="t"||k==="T"){ timerEl.style.display = timerEl.style.display==="block"?"none":"block"; }
  else if(k==="r"||k==="R"){ t0=null; }
  else if(k==="p"||k==="P"){ openPresenter(); }
  else if(/^[1-8]$/.test(k)){ go(+k-1); }
  document.getElementById("hint").style.opacity=0;
}
document.addEventListener("keydown", onKey);
document.addEventListener("click", e=>{ if(e.target.closest("a")) return; next(); document.getElementById("hint").style.opacity=0; });

/* restore position from hash (#slide.beat) */
(function(){ const m=location.hash.match(/^#(\d+)(?:\.(\d+))?/); if(m){ cur=Math.min(S.length-1,Math.max(0,+m[1]-1)); beat=Math.min(S[cur].beats,+(m[2]||0)); } render(0); })();
setTimeout(()=>{ document.getElementById("hint").style.opacity=0; }, 6000);
</script>
