<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space-Normal — pitch</title>
<style>
/* ================================================================
   SPACE-NORMAL · PITCH DECK (offline, single file)
   Keys: → Space PageDown click = next · ← PageUp = back
         F fullscreen · T timer · R reset timer · P presenter · 1–8 jump
   All texts live in the CONFIG object at the top of the <script>.
   ================================================================ */
:root{
  --bg:#000;
  --ink:#f2f4f7;
  --dim:rgba(242,244,247,.62);
  --faint:rgba(242,244,247,.38);
  --teal:#38e1d4;
  --teal-dim:rgba(56,225,212,.18);
  --mars:#e0703a;
  --red:#ff4d4d;
  --amber:#ffb547;
  --font:"Helvetica Neue", Helvetica, -apple-system, "Segoe UI", Arial, sans-serif;
  --s:1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;cursor:default;-webkit-font-smoothing:antialiased}
canvas#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}

/* glows (generated, no images) */
.glow{position:fixed;border-radius:50%;pointer-events:none;z-index:1;filter:blur(40px);
  transition:left 1.8s cubic-bezier(.4,0,.2,1), top 1.8s cubic-bezier(.4,0,.2,1), width 1.8s, height 1.8s, opacity 1.8s}
.glow.mars{background:radial-gradient(circle, rgba(224,112,58,.55) 0%, rgba(224,112,58,.18) 38%, rgba(224,112,58,0) 70%)}
.glow.teal{background:radial-gradient(circle, rgba(56,225,212,.35) 0%, rgba(56,225,212,.10) 40%, rgba(56,225,212,0) 70%)}

/* stage: fixed 1600×900 logical canvas scaled to fit */
.stage{position:fixed;left:50%;top:50%;width:1600px;height:900px;z-index:3;
  transform:translate(-50%,-50%) scale(var(--s));transform-origin:center center}
.scene{position:absolute;inset:0;padding:96px 110px 92px;opacity:0;pointer-events:none;
  transform:scale(.955);filter:blur(8px);
  transition:opacity .9s cubic-bezier(.4,0,.2,1), transform 1.1s cubic-bezier(.2,.7,.2,1), filter .9s}
.scene.active{opacity:1;transform:none;filter:none;pointer-events:auto}
.scene.past{opacity:0;transform:scale(1.07);filter:blur(10px)}

/* staggered beats */
[data-beat]{opacity:0;transform:translateY(16px);
  transition:opacity .75s ease, transform .9s cubic-bezier(.2,.7,.2,1);
  transition-delay:calc(var(--i,0) * 160ms + 120ms)}
[data-beat].on{opacity:1;transform:none}

/* type */
.kicker{font-size:20px;letter-spacing:.42em;text-transform:uppercase;color:var(--teal);font-weight:500}
.title{font-size:54px;line-height:1.08;letter-spacing:.06em;text-transform:uppercase;font-weight:500;margin-top:14px}
.sub{font-size:24px;color:var(--dim);margin-top:14px;letter-spacing:.02em}
.small{font-size:17px;color:var(--dim);letter-spacing:.02em}
.tag{display:inline-block;font-size:13px;letter-spacing:.22em;text-transform:uppercase;padding:5px 10px;border:1px solid currentColor;border-radius:3px}
.tag.syn{color:var(--amber)}
.tag.ph{color:var(--amber);font-size:11px;padding:2px 6px;margin-left:8px;vertical-align:middle}
.foot{position:absolute;left:110px;right:110px;bottom:58px;font-size:14px;line-height:1.5;color:rgba(242,244,247,.46);letter-spacing:.03em}
.foot b{color:var(--dim);font-weight:500}
.teal{color:var(--teal)} .mars{color:var(--mars)} .red{color:var(--red)} .amber{color:var(--amber)}
/* film-subtitle caption: one line per slide, lower third, centered */
.cap{position:absolute;left:60px;right:60px;bottom:100px;text-align:center;font-size:44px;line-height:1.15;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:#fff;text-shadow:0 2px 28px rgba(0,0,0,.85)}
.cap small{display:block;font-size:19px;letter-spacing:.26em;color:var(--dim);margin-top:14px;font-weight:400;text-shadow:none}
.cap.fever{color:#ff8a8a;text-shadow:0 0 36px rgba(255,77,77,.55)}
.cap.fever.on{animation:fever 1.6s ease-in-out 2}
@keyframes fever{0%,100%{text-shadow:0 0 24px rgba(255,77,77,.35)}50%{text-shadow:0 0 70px rgba(255,77,77,.85)}}
/* one tiny, low-contrast source line per slide */
.src1{position:absolute;left:110px;right:110px;bottom:52px;font-size:13px;line-height:1.3;color:rgba(242,244,247,.36);
  letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}

/* film overlays */
.grain{position:fixed;inset:-50%;z-index:6;pointer-events:none;opacity:.07;mix-blend-mode:screen;animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.vignette{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.72) 100%)}
.bar{position:fixed;left:0;right:0;height:4.4vh;background:#000;z-index:7}
.bar.top{top:0}.bar.bot{bottom:0}
.progress{position:fixed;left:0;bottom:0;height:2px;background:var(--teal);opacity:.55;z-index:8;transition:width .9s cubic-bezier(.4,0,.2,1)}
#timer{position:fixed;top:1.1vh;right:1.4vw;z-index:9;font:500 15px/1 var(--font);letter-spacing:.12em;color:var(--dim);display:none;font-variant-numeric:tabular-nums}
#timer.warn{color:var(--amber)} #timer.over{color:var(--red)}
#hint{position:fixed;top:1.1vh;left:1.4vw;z-index:9;font:13px/1 var(--font);letter-spacing:.1em;color:var(--faint);transition:opacity 1.5s}

/* ---------- S1 hook ---------- */
.hook{display:grid;grid-template-columns:500px 560px;gap:90px;justify-content:center;align-items:center;height:600px;margin-top:-10px}
.hook .txt{display:flex;flex-direction:column;align-items:center;text-align:center}
.hook .day{font-size:24px;letter-spacing:.5em;text-transform:uppercase;color:var(--teal);font-weight:500;margin-right:-.5em}
.hook .temp{font-size:210px;margin-top:18px}
/* portal: astronaut clip seen through a hologram ring (crop excludes suit patch) */
.portal{position:relative;width:500px;height:500px}
.portal .pv{position:absolute;inset:34px;border-radius:50%;overflow:hidden;background:#05080b;clip-path:circle(50% at 50% 50%)}
.portal video{width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:contrast(1.1) saturate(1.15) brightness(.92);transform:scale(1.04)}
.portal .pv:after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(56,225,212,.07) 0 1px, transparent 1px 3px),
             radial-gradient(circle at 50% 45%, rgba(0,0,0,0) 50%, rgba(0,0,0,.78) 100%);
  box-shadow:inset 0 0 70px rgba(56,225,212,.28)}
.portal .ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 10px rgba(56,225,212,.75))}
.portal .ring circle,.portal .ring path{transition:stroke .6s}
.portal .ring .spin{transform-box:view-box;transform-origin:50% 50%;animation:spin 48s linear infinite}
.portal.alarm .ring .c1{stroke:#ff4d4d}
.portal.alarm .ring{filter:drop-shadow(0 0 14px rgba(255,77,77,.8))}
@keyframes spin{to{transform:rotate(360deg)}}
/* intro planets layer + hologram bridge (film clips, captions cut out) */
#intro{position:fixed;inset:0;z-index:2;display:grid;place-items:center;pointer-events:none;opacity:0;visibility:hidden}
#intro video{width:90vw;height:auto;max-height:94vh;object-fit:cover;filter:contrast(1.08) saturate(1.12);
  -webkit-mask-image:radial-gradient(ellipse 58% 62% at 50% 50%, #000 55%, transparent 100%);
          mask-image:radial-gradient(ellipse 58% 62% at 50% 50%, #000 55%, transparent 100%)}
#holo{position:fixed;left:50%;top:50%;height:62vh;aspect-ratio:360/432;z-index:4;pointer-events:none;opacity:0;visibility:hidden}
#holo video{width:100%;height:100%;object-fit:cover;filter:saturate(1.15);
  -webkit-mask-image:radial-gradient(ellipse 50% 52% at 50% 50%, #000 58%, transparent 100%);
          mask-image:radial-gradient(ellipse 50% 52% at 50% 50%, #000 58%, transparent 100%)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
.wordmark.hold{opacity:0!important}
/* GSAP drives scene transforms/opacity when loaded */
.gs .scene{transition:none!important;filter:none!important}
.temp{font-size:230px;font-weight:200;letter-spacing:-.02em;line-height:1;margin-top:26px;font-variant-numeric:tabular-nums;transition:color .6s, text-shadow .6s}
.temp small{font-size:80px;font-weight:300;margin-left:10px;color:var(--dim)}
.temp.alarm{color:#ff6b6b;text-shadow:0 0 50px rgba(255,77,77,.45)}
.hero-line{font-size:44px;letter-spacing:.14em;text-transform:uppercase;margin-top:28px;font-weight:400}
.alarm-box{margin-top:30px;border:2px solid var(--red);color:var(--red);padding:14px 30px;border-radius:4px;
  font-size:34px;letter-spacing:.3em;text-transform:uppercase;background:rgba(255,77,77,.08)}
.alarm-box.on{animation:blink 1.1s ease-in-out 3}
.alarm-box span{display:block;font-size:16px;letter-spacing:.18em;color:rgba(255,120,120,.8);margin-top:6px}
@keyframes blink{0%,100%{box-shadow:0 0 0 rgba(255,77,77,0)}50%{box-shadow:0 0 60px rgba(255,77,77,.55);background:rgba(255,77,77,.22)}}

/* ---------- S2 problem ---------- */
.link-svg{display:block;width:1180px;height:240px;margin:14px auto 0}
.nums{display:grid;grid-template-columns:repeat(3,360px);gap:70px;justify-content:center;margin-top:34px;text-align:center}
.num .big{font-size:150px;font-weight:200;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.num .big small{font-size:44px;font-weight:400;letter-spacing:.14em;margin-left:10px;color:var(--teal)}
.num .lbl{font-size:21px;white-space:nowrap;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:18px}

/* ---------- S3 chart ---------- */
.chart{display:block;width:1380px;height:552px;margin-top:6px;overflow:visible}
.chart text{font-family:var(--font)}
.syn-label{position:absolute;right:110px;top:58px}

/* ---------- S4 product ---------- */
.card{width:860px;margin:6px auto 0;border:1px solid rgba(56,225,212,.55);border-radius:22px;
  background:linear-gradient(180deg, rgba(56,225,212,.11), rgba(56,225,212,.03));
  box-shadow:0 0 90px rgba(56,225,212,.16), inset 0 0 40px rgba(56,225,212,.05);padding:26px 40px 12px;position:relative;overflow:hidden}
.card:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(56,225,212,.04) 0 1px, transparent 1px 4px);pointer-events:none}
.card .hdr{display:flex;justify-content:space-between;font-size:15px;letter-spacing:.28em;color:var(--teal);text-transform:uppercase;padding-bottom:14px;border-bottom:1px solid rgba(56,225,212,.3)}
.card .r{padding:18px 0 16px;border-bottom:1px solid rgba(56,225,212,.14)}
.card .r:last-child{border-bottom:0}
.card .r .h{font-size:16px;letter-spacing:.3em;font-weight:600}
.card .r .t{font-size:32px;margin-top:8px;line-height:1.25;font-weight:300}
.users{display:flex;justify-content:center;gap:90px;margin-top:30px}
.users .u{display:flex;flex-direction:column;align-items:center;gap:12px}
.users .ic{width:58px;height:58px;border:1px solid var(--teal);border-radius:50%;display:grid;place-items:center;color:var(--teal);font-size:24px;box-shadow:0 0 26px rgba(56,225,212,.25)}
.users .n{font-size:21px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}

/* ---------- S5 proof ---------- */
.proof{display:grid;grid-template-columns:repeat(3,430px);gap:40px;justify-content:center;margin-top:150px;text-align:center}
.tok .big{font-size:76px;white-space:nowrap;font-weight:200;letter-spacing:.02em;color:var(--teal);line-height:1;height:150px;display:flex;align-items:flex-end;justify-content:center;text-shadow:0 0 40px rgba(56,225,212,.3)}
.tok .big.n{font-size:128px;letter-spacing:-.02em}
.tok .lbl{font-size:22px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-top:20px}
.headline-x{display:none} /* PLAN A: show when docs/claims.md has the headline number */

/* ---------- S6 difference ---------- */
.diff{display:grid;grid-template-columns:560px 200px 560px;justify-content:center;align-items:center;margin-top:140px;text-align:center}
.qa .who{font-size:17px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim)}
.qa .q{font-size:62px;line-height:1.15;margin-top:22px;font-weight:300}
.qa.sn .who{color:var(--teal)} .qa.sn .q{color:var(--teal);text-shadow:0 0 40px rgba(56,225,212,.3)}
.arrow svg{width:170px;height:40px;display:block;margin:0 auto}

/* ---------- S7 close ---------- */
.close{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center}
.callback{font-size:30px;letter-spacing:.24em;text-transform:uppercase;font-weight:300;color:var(--dim)}
.callback b{font-weight:500;color:var(--teal)}
.wordmark{font-size:104px;letter-spacing:.16em;font-weight:600;margin-top:46px}
.beat-line{width:900px;height:90px;margin-top:4px}
.tagline{font-size:32px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);margin-top:8px}
.url{font-size:16px;letter-spacing:.14em;color:var(--teal);margin-top:30px;opacity:.7}
/* ---------- S8 sources ---------- */
.src{columns:2;column-gap:56px;margin-top:26px;font-size:14px;line-height:1.45;color:var(--dim)}
.src li{break-inside:avoid;margin:0 0 9px 18px}
.src li b{color:var(--ink);font-weight:500}
.src a{color:var(--teal);text-decoration:none;word-break:break-all}

/* draw-on helpers */
.draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.6s cubic-bezier(.4,0,.2,1) .2s}
.on .draw,.draw.on{stroke-dashoffset:0}

@media (prefers-reduced-motion: reduce){
  *,*:before,*:after{transition-duration:0s!important;transition-delay:0s!important;animation:none!important}
  .scene{filter:none!important}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="glow mars" id="glowMars"></div>
<div class="glow teal" id="glowTeal"></div>
<div id="intro"><video id="vPlanets" src="../assets/planets.mp4" muted playsinline preload="auto"></video></div>
<div class="stage" id="stage"></div>
<div id="holo"><video id="vHolo" src="../assets/holo.mp4" muted playsinline preload="auto"></video></div>
<canvas id="fx"></canvas>
<div class="vignette"></div>
<div class="grain" id="grain"></div>
<div class="bar top"></div><div class="bar bot"></div>
<div class="progress" id="progress"></div>
<div id="timer">0:00 / 2:30</div>
<div id="hint">→ dalej · ← wstecz · F pełny ekran · P notatki · T timer</div>

<!-- GSAP 3.13.0, vendored for offline use (classic script, works on file://). Missing → CSS fallback. -->
<script src="../vendor/gsap.min.js"></script>
<script>
/* =================================================================
   CONFIG — ALL EDITABLE TEXT LIVES HERE.
   HERO: astronaut name (undecided). APP_URL: public dashboard link.
   time: [start, end] seconds within the 2:30 pitch (null = untimed).
   beats: number of extra clicks inside the slide before moving on.
   notes: Polish speaker notes (SZKIC = draft). {HERO} is substituted.
   ================================================================= */
const HERO = "Vega";
const APP_URL = "{APP_URL}";
const TOTAL = 150; // 2:30

const CONFIG = {
  slides: [
    { key:"hook", title:"Dzień 80", time:[0,15], beats:1,
      glow:{mars:[78,40,62], teal:[22,55,40]},
      text:{ day:"Dzień 80", from:36.6, to:37.7, cap:"Gorączka?" },
      src:"SYNTHETIC · scenariusz flight-like · Stahn i in. 2017, Sci Rep",
      notes:"Dzień osiemdziesiąty w drodze na Marsa. {HERO} rano mierzy temperaturę. Trzydzieści siedem i siedem. [klik] Na Ziemi lekarz powiedziałby: gorączka. Czy {HERO} jest chora?" },

    { key:"problem", title:"Nie ma kogo zapytać", time:[15,35], beats:3,
      glow:{mars:[86,30,40], teal:[12,30,30]},
      text:{ cap:"Nie ma kogo zapytać.", earth:"Ziemia", mars:"Mars",
             nums:[ ["22","min","maks. opóźnienie"], ["~2","tyg.","ciszy radiowej"], ["0","","lekarzy wymaganych"] ] },
      src:"Źródła: ASCEND/NASA — Communication Delays… for Crewed Mars Missions · NASA 2025 Architecture Update · HRP 48021 · NASA-STD-3001 Vol 1 Rev C · TH-8LM",
      notes:"[klik] Problem w tym, że nie ma kogo zapytać. [klik] Wiadomość do Ziemi leci do dwudziestu dwóch minut. [klik] Czasem trwa ok. dwóch tygodni cisza. [klik] A standard NASA nie wymaga lekarza na pokładzie. Jest oficer medyczny — po krótkim szkoleniu." },

    { key:"chart", title:"Jej norma się przesuwa", time:[35,65], beats:5,
      glow:{mars:[90,20,30], teal:[40,60,70]},
      text:{ cap:"Jej norma się przesuwa.", sub:"Siatka centylowa dla astronauty",
             earthLbl:"Ziemska norma", preLbl:"Zakres sprzed lotu", corLbl:"Jej korytarz",
             xLbl:"dzień misji", syn:"SYNTHETIC · flight-like, literatura (Stahn 2017)" },
      src:"Źródła: Stahn i in. 2017, Sci Rep · NASA CDSS ConOps HRP-48033 (2021): „pre-flight determined reference ranges” · wykres poglądowy, SYNTHETIC",
      notes:"[klik] Spójrzmy na temperaturę Vegi. [klik] Ziemska norma jest jedna — dla wszystkich. [klik] Zakres sprzed lotu jest osobisty, ale płaski. [klik] A ciało w kosmosie powinno się zmieniać. Zdrowy astronauta po paru miesiącach może mieć ok. trzydziestu ośmiu stopni. Dlatego Space-Normal rysuje każdemu jego korytarz. Jak siatka centylowa u pediatry — tylko zamiast wieku jest dzień misji. [klik] Trzydzieści siedem i siedem? Dla Vegi w dniu osiemdziesiątym to norma. [klik] A równe trzydzieści siedem? Dla Ziemi — OK. Dla niej — sygnał: sprawdź." },

    { key:"product", title:"Każdego ranka: 3 linijki", time:[65,85], beats:1,
      glow:{mars:[8,85,30], teal:[50,40,80]},
      text:{ cap:"Każdego ranka. Trzy linijki.",
             card:{ hdr:["Morning check · Day 80","{HERO}"],
                    rows:[ ["OBSERVATION","teal","37.0 °C — below your day-80 corridor.", false],
                           ["CHECK NOW","amber","Re-measure after rest. Check heart rate.", false],
                           ["ESCALATE IF","red","Still outside tomorrow, or {threshold}.", true] ] },
             users:[ ["◉","astronauta"], ["✚","oficer medyczny"], ["⊕","lekarz na Ziemi"] ] },
      src:"Źródło: NASA-STD-3001 Vol 1 Rev C („monitoring, and trending vital signs”) · karta: demo SYNTHETIC · progi eskalacji = placeholder",
      notes:"[klik] Co dostaje {HERO}? Każdego ranka trzy linijki: co widzimy, co sprawdzić teraz, kiedy eskalować. [klik] Oficer medyczny widzi całą załogę. Lekarz na Ziemi dostaje krótki pakiet — tylko gdy ktoś wypada z korytarza. Alarmu nie wywołuje AI. Liczy go przejrzysta statystyka, offline." },

    { key:"proof", title:"Zbudowane na danych NASA", time:[85,115], beats:0,
      glow:{mars:[80,80,40], teal:[20,25,60]},
      text:{ cap:"Zbudowane na danych NASA.", limit:"analog naziemny · nie lot",
             cards:[ ["BED REST","NASA",false], ["18 + 11","nauka · zamknięty test",true], ["STANFORD","prawdziwe choroby",false] ],
             headline:"{X} fałszywych alarmów na załogo-miesiąc vs {Y} dla najlepszej metody bazowej · wykryto {S}% chorób, mediana {L} dni przed objawami" },
      src:"Źródła: NASA Life Sciences Portal — Bed Rest (Campaign 1 + 3, CFT70) · Stanford COVID-19 Wearables — Mishra i in. 2020 · Moon to Mars HBS-2LM",
      notes:"[klik] Budujemy to na prawdziwych danych NASA z eksperymentów bed rest. Ludzie leżą tygodniami z głową lekko w dół — tak NASA symuluje nieważkość. Osiemnaście osób do nauki. Jedenaście w zamkniętym teście — kod blokuje do nich dostęp, dopóki nie zamrozimy modelu. Choroby to prawdziwe sygnały z badań Stanforda. Uczciwie: bed rest to analog naziemny, nie lot. Tryb lotu w demo jest oznaczony jako syntetyczny." },

    { key:"diff", title:"Warstwa przed diagnozą", time:[115,135], beats:1,
      glow:{mars:[85,55,34], teal:[15,55,50]},
      text:{ cap:"Warstwa przed diagnozą.",
             sn:{ who:"Space-Normal", q:"„Czy to normalne — u&nbsp;mnie, dziś?”" },
             cmo:{ who:"CMO-DA · NASA JSC", q:"„Co mi jest?”" } },
      src:"Źródła (blogi firm, nie NASA): Google Cloud 2025 · Red Hat 2026 · prior art: Baevsky / IBMP, NASA CDSS HRP-48033",
      notes:"[klik] NASA już testuje asystenta CMO-DA — najpierw z Google, teraz offline z Red Hat. On odpowiada na pytanie: co mi jest? [klik] My — na pytanie wcześniejsze: czy to jeszcze normalne — u mnie, dziś? I przekazujemy tę odpowiedź dalej. Osobisty baseline nie jest nowy. Nowy jest korytarz, który ugina się z misją." },

    { key:"close", title:"Twoja norma. W kosmosie.", time:[135,150], beats:1,
      glow:{mars:[50,96,70], teal:[50,40,40]},
      text:{ callback:"Dzień 80 · <b>37,7 °C ✓</b>",

const CH = { W:1380, H:552, x0:80, x1:1300, y0:490, y1:24, dMax:120, tMin:36.0, tMax:38.4 };
const X = d => CH.x0 + (d/CH.dMax)*(CH.x1-CH.x0);
const Y = t => CH.y0 - ((t-CH.tMin)/(CH.tMax-CH.tMin))*(CH.y0-CH.y1);
const center = d => 36.7 + 1.1*(1-Math.exp(-d/24));
const HALF = 0.25;
function corridorPaths(){
  let up=[], lo=[], mid=[];
  for(let d=0; d<=CH.dMax; d+=2){ up.push([X(d),Y(center(d)+HALF)]); lo.push([X(d),Y(center(d)-HALF)]); mid.push([X(d),Y(center(d))]); }
  const band = "M"+up.map(p=>p.join(",")).join(" L")+" L"+lo.reverse().map(p=>p.join(",")).join(" L")+" Z";
  const line = "M"+mid.map(p=>p.join(",")).join(" L");
  let dots="";
  for(let d=1; d<80; d+=2){ const n=Math.sin(d*12.9898)*43758.5453; const r=(n-Math.floor(n)-.5)*0.28; dots+=`<circle cx="${X(d)}" cy="${Y(center(d)+r)}" r="3.5" fill="#38e1d4" opacity=".5"/>`; }
  return {band,line,dots};
}

/* ---------- build ---------- */
const stage = document.getElementById("stage");
S.forEach((s,i)=>{
  const sec=document.createElement("section");
  sec.className="scene"; sec.dataset.idx=i; sec.innerHTML=B[s.key](s);
  stage.appendChild(sec);
});
const scenes=[...stage.querySelectorAll(".scene")];

/* ---------- scale stage ---------- */
function fit(){ const s=Math.min(innerWidth/1600, innerHeight/900); document.documentElement.style.setProperty("--s", s); }
addEventListener("resize", fit); fit();

/* ---------- state & navigation ---------- */
let cur=0, beat=0;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- cinematic layer (GSAP; falls back to CSS transitions) ---------- */
const G = window.gsap || null;
const CINE = !!G && !reduce;
if(CINE) document.body.classList.add("gs");
let started = !CINE;           // false = black pre-roll; first press plays the intro
let tl = null;                 // active slide-to-slide timeline (2nd press fast-forwards it)
let shown = 0;                 // scene currently on screen
const warp = { speed: reduce ? 0 : .6 };
const $ = id => document.getElementById(id);
function playV(v,rate){ try{ v.currentTime=0; v.playbackRate=rate; const p=v.play(); if(p) p.catch(()=>{}); }catch(e){} }

function applyBeats(i){
  scenes[i].querySelectorAll("[data-beat]").forEach(el=>{
    el.classList.toggle("on", i===cur && started && +el.dataset.beat<=beat);
  });
}
function push(A,B){
  return G.timeline({defaults:{ease:"expo.inOut"}})
    .to(warp,{speed:26,duration:.7,ease:"expo.in"},0)
    .fromTo(A,{scale:1,autoAlpha:1},{scale:2.5,autoAlpha:0,duration:1.1},0)
    .fromTo(B,{scale:.35,autoAlpha:0},{scale:1,autoAlpha:1,duration:1.2},.35)
    .to(warp,{speed:.6,duration:.9,ease:"expo.out"},.75);
}
const TR = {
  // problem → corridor: fly through a hologram body ("the body changes") into the chart
  "1>2": (A,B)=>{ const h=$("holo"), v=$("vHolo");
    return G.timeline({defaults:{ease:"expo.inOut"}})
      .to(warp,{speed:22,duration:.6,ease:"expo.in"},0)
      .fromTo(A,{scale:1,autoAlpha:1},{scale:2.5,autoAlpha:0,duration:1.0},0)
      .call(()=>{ playV(v,.8) },null,.25)
      .fromTo(h,{xPercent:-50,yPercent:-50,autoAlpha:0,scale:.45},{autoAlpha:1,scale:1,duration:.9,ease:"expo.out"},.3)
      .to(h,{scale:3.4,autoAlpha:0,duration:1.0,ease:"expo.in"},1.45)
      .fromTo(B,{scale:.35,autoAlpha:0},{scale:1,autoAlpha:1,duration:1.2},1.7)
      .to(warp,{speed:.6,duration:.9,ease:"expo.out"},1.95); }
};
const ENTRY = { "1>2":1.7 };   // when the incoming scene appears (beats start then)
function transition(a,b,dir){
  if(tl) tl.progress(1);
  const A=scenes[a], B=scenes[b];
  if(dir===0){ G.set(scenes,{autoAlpha:0,scale:1}); G.set(B,{autoAlpha:1,scale:1}); applyBeats(b); return; }
  if(dir<0){
    tl=G.timeline().to(A,{autoAlpha:0,scale:1,duration:.4}).fromTo(B,{autoAlpha:0,scale:1},{autoAlpha:1,scale:1,duration:.4},0);
    applyBeats(b); return;
  }
  const key=a+">"+b;
  tl=(TR[key]||push)(A,B);
  tl.call(()=>applyBeats(b), null, ENTRY[key] ?? .35);
}

/* intro: black → planets push-in → warp → portal opens on the astronaut → slide-1 overlays */
function setPortal(open){
  const ring=$("ring"), pv=$("pv");
  if(open){ G.set(ring,{autoAlpha:1,scale:1,rotation:0,transformOrigin:"50% 50%"}); G.set(pv,{clipPath:"circle(50% at 50% 50%)"}); }
  else    { G.set(ring,{autoAlpha:0,scale:.2,transformOrigin:"50% 50%"}); G.set(pv,{clipPath:"circle(0% at 50% 50%)"}); }
}
function astroLoop(){
  const va=$("vAstro"); playV(va,.25);
  if(CINE) G.fromTo(va,{scale:1.04},{scale:1.16,duration:16,ease:"none"});
}
function warmVideos(){
  ["vHolo"].forEach(id=>{ const v=$(id); try{ v.play().then(()=>{ v.pause(); v.currentTime=0; }).catch(()=>{}); }catch(e){} });
}
function playIntro(){
  started=true; warmVideos();
  const I=$("intro"), vp=$("vPlanets"), ring=$("ring"), pv=$("pv");
  playV(vp,.38);
  G.set(I,{transformOrigin:"68% 50%"});
  tl=G.timeline()
    .fromTo(I,{autoAlpha:0,scale:1},{autoAlpha:1,duration:1.0,ease:"power2.out"},0)
    .to(I,{scale:1.8,duration:3.4,ease:"power2.in"},0)
    .to(warp,{speed:16,duration:1.6,ease:"expo.in"},1.0)
    .call(astroLoop,null,2.3)
    .fromTo(ring,{scale:.2,autoAlpha:0,rotation:-90},{scale:1,autoAlpha:1,rotation:0,duration:1.6,ease:"expo.out"},2.3)
    .fromTo(pv,{clipPath:"circle(0% at 50% 50%)"},{clipPath:"circle(50% at 50% 50%)",duration:1.5,ease:"expo.out"},2.45)
    .to(I,{autoAlpha:0,duration:.9,ease:"power1.in"},2.6)
    .to(warp,{speed:.6,duration:1.4,ease:"expo.out"},2.7)
    .call(()=>render(1),null,3.3);
}
function finishIntro(){
  if(started) return;
  started=true; G.set($("intro"),{autoAlpha:0}); setPortal(true); astroLoop();
}

function render(dir){
  const changed = shown!==cur;
  scenes.forEach((sc,i)=>{
    sc.classList.toggle("active", i===cur);
    sc.classList.toggle("past", i<cur);
    if(!(CINE && changed && dir>0 && i===cur)) applyBeats(i);
  });
  if(CINE && changed) transition(shown, cur, dir);
  shown=cur;
  // glows
  const g=S[cur].glow;
  place(document.getElementById("glowMars"), g.mars);
  place(document.getElementById("glowTeal"), g.teal);
  document.getElementById("progress").style.width = (100*(cur)/(S.length-1))+"%";
  camTarget = {x: cur*160, y: Math.sin(cur*1.3)*60, z: 1+cur*.02};
  hooks(dir);
  try{ history.replaceState(null,"","#"+(cur+1)+"."+beat); }catch(e){}
  updatePresenter();
}
function place(el,[x,y,size]){ const px=size*innerWidth/100; el.style.width=el.style.height=px+"px"; el.style.left=(x*innerWidth/100-px/2)+"px"; el.style.top=(y*innerHeight/100-px/2)+"px"; el.style.opacity=size?1:0; }

function busy(){ if(tl && tl.isActive()){ tl.progress(1); return true; } return false; } // 2nd press = fast-forward
function next(){ if(busy()) return; startTimer();
  if(!started){ playIntro(); updatePresenter(); return; }
  if(beat<S[cur].beats){beat++;render(1);} else if(cur<S.length-1){cur++;beat=0;render(1);} }
function prev(){ if(busy()) return; if(beat>0){beat--;render(-1);} else if(cur>0){cur--;beat=S[cur].beats;render(-1);} }
function go(i){ if(i>=0&&i<S.length){ if(tl) tl.progress(1); if(CINE) finishIntro(); cur=i;beat=0;render(0);} }

/* ---------- per-slide animation hooks ---------- */
let tempAnim=null, corAnim=null;
function hooks(dir){
  const k=S[cur].key;
  // hook: temperature counter
  const temp=document.getElementById("temp"), alarm=document.getElementById("alarm");
  if(k==="hook"){
    const t=S[cur].text;
    if(!started){ cancelAnimationFrame(tempAnim); setTemp(temp,t.from); }
    else if(beat===0 && dir>=0){ animateNum(temp,t.from,t.to,2400); }
    else { cancelAnimationFrame(tempAnim); setTemp(temp,t.to); }
    temp.classList.toggle("alarm", beat>=1);
    alarm.classList.toggle("on", beat>=1);
    $("portal").classList.toggle("alarm", beat>=1);
  } else { cancelAnimationFrame(tempAnim); temp.classList.remove("alarm"); }
  // close: particle wordmark on the logo beat
  if(k==="close" && beat===1 && dir>0) assembleWordmark();
  else if(!(k==="close" && beat>=1) || dir===0) stopParticles();
  // chart: corridor reveal
  const rect=document.getElementById("corRect");
  if(k==="chart"){
    if(beat===3 && dir>0) revealCorridor(rect);
    else if(beat>=3) rect.setAttribute("width", CH.W);
    else { cancelAnimationFrame(corAnim); rect.setAttribute("width", 0); }
    document.getElementById("dotA").style.opacity = beat>=5 ? .45 : "";
  }
}
/* closing wordmark assembles from particles (text pixels → targets) */
const fxc=$("fx"), fxx=fxc.getContext("2d"); let partAnim=null;
function stopParticles(){ cancelAnimationFrame(partAnim); partAnim=null; fxx.clearRect(0,0,fxc.width,fxc.height);
  const wm=document.querySelector(".wordmark"); if(wm) wm.classList.remove("hold"); }
function assembleWordmark(){
  const wm=document.querySelector(".wordmark"); if(!wm || !CINE) return;
  stopParticles();
  const D=Math.min(2,devicePixelRatio||1); fxc.width=innerWidth*D; fxc.height=innerHeight*D; fxc.style.opacity=1;
  wm.style.transition="none"; wm.style.transform="none"; const r=wm.getBoundingClientRect(); wm.style.transition=""; wm.style.transform="";
  wm.classList.add("hold");
  const cs=getComputedStyle(wm), sc=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--s"))||1;
  const fs=parseFloat(cs.fontSize)*sc, off=document.createElement("canvas"), W=Math.ceil(r.width*D), Hh=Math.ceil(r.height*D);
  off.width=W; off.height=Hh; const o=off.getContext("2d");
  o.font=`${cs.fontWeight} ${fs*D}px ${cs.fontFamily}`; o.textAlign="center"; o.textBaseline="middle"; o.fillStyle="#fff";
  try{ o.letterSpacing=(fs*.16*D)+"px"; }catch(e){}
  o.fillText(wm.textContent.trim(), W/2+fs*.08*D, Hh/2);
  const data=o.getImageData(0,0,W,Hh).data, P=[], step=Math.max(3,Math.round(3*D));
  for(let y=0;y<Hh;y+=step) for(let x=0;x<W;x+=step) if(data[(y*W+x)*4+3]>140){
    const a=Math.random()*6.283, d=(.35+Math.random()*.6)*fxc.width;
    P.push({tx:r.left*D+x, ty:r.top*D+y, sx:fxc.width/2+Math.cos(a)*d, sy:fxc.height*.42+Math.sin(a)*d*.6, dl:Math.random()*.45});
  }
  const t0=performance.now(), dur=1.5;
  const tick=now=>{
    const t=(now-t0)/1000; fxx.clearRect(0,0,fxc.width,fxc.height);
    for(const p of P){ const k=Math.max(0,Math.min(1,(t-p.dl)/dur)), e=k===1?1:1-Math.pow(2,-10*k);
      const x=p.sx+(p.tx-p.sx)*e, y=p.sy+(p.ty-p.sy)*e;
      fxx.fillStyle = k<1 ? `rgba(120,240,230,${.35+.65*k})` : "#f2f4f7"; fxx.fillRect(x,y,step*.7,step*.7); }
    if(t<dur+.5){ partAnim=requestAnimationFrame(tick); }
    else { wm.classList.remove("hold"); G.to(fxc,{opacity:0,duration:.7,onComplete:()=>{ fxx.clearRect(0,0,fxc.width,fxc.height); }}); partAnim=null; }
  };
  partAnim=requestAnimationFrame(tick);
}
function setTemp(el,v){ el.innerHTML=v.toFixed(1).replace(".",",")+"<small>°C</small>"; }
function animateNum(el,a,b,ms){
  cancelAnimationFrame(tempAnim);
  if(reduce){ setTemp(el,b); return; }
  const t0=performance.now()+500;
  const step=now=>{ const p=Math.max(0,Math.min(1,(now-t0)/ms)); const e=1-Math.pow(1-p,3); setTemp(el,a+(b-a)*e); if(p<1) tempAnim=requestAnimationFrame(step); };
  setTemp(el,a); tempAnim=requestAnimationFrame(step);
}
function revealCorridor(rect){
  cancelAnimationFrame(corAnim);
  if(reduce){ rect.setAttribute("width",CH.W); return; }
  const t0=performance.now()+250, ms=2600;
  const step=now=>{ const p=Math.max(0,Math.min(1,(now-t0)/ms)); const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2; rect.setAttribute("width", CH.x0 + e*(CH.W-CH.x0)); if(p<1) corAnim=requestAnimationFrame(step); };
  rect.setAttribute("width", CH.x0); corAnim=requestAnimationFrame(step);
}

/* ---------- starfield (canvas, generated) ---------- */
const cv=document.getElementById("stars"), cx=cv.getContext("2d");
let stars=[], cam={x:0,y:0,z:1}, camTarget={x:0,y:0,z:1}, DPR=1;
function initStars(){
  DPR=Math.min(2, devicePixelRatio||1);
  cv.width=innerWidth*DPR; cv.height=innerHeight*DPR;
  stars=[]; let seed=7;
  const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  [[420,.15,.7],[200,.4,1.1],[70,.9,1.7]].forEach(([n,depth,size])=>{
    for(let i=0;i<n;i++) stars.push({x:rnd()*4000,y:rnd()*2400,d:depth,s:size*(.5+rnd()),tw:rnd()*6.28,c:rnd()<.1?"255,200,170":(rnd()<.15?"170,240,235":"235,240,255")});
  });
}
let lastT=performance.now(), drift=0;
function drawStars(now){
  const dt=Math.min(50,now-lastT); lastT=now;
  if(!reduce) drift+=dt*0.006;
  const k=reduce?1:0.025;
  cam.x+=(camTarget.x-cam.x)*k; cam.y+=(camTarget.y-cam.y)*k; cam.z+=(camTarget.z-cam.z)*k;
  const w=cv.width,h=cv.height;
  cx.fillStyle="#000"; cx.fillRect(0,0,w,h);
  for(const st of stars){
    let x=((st.x - (cam.x+drift)*st.d)%4000+4000)%4000, y=((st.y - cam.y*st.d)%2400+2400)%2400;
    x = (x/4000)*w*1.15 - w*.075; y=(y/2400)*h*1.15 - h*.075;
    // push-in: scale from center by depth
    const z=1+(cam.z-1)*st.d*3; x=w/2+(x-w/2)*z; y=h/2+(y-h/2)*z;
    const a = reduce ? .8 : (.55+.45*Math.sin(st.tw+now*0.0012*st.d*2));
    cx.fillStyle=`rgba(${st.c},${a*Math.min(1,.35+st.d)})`;
    const r=st.s*DPR*.6;
    cx.beginPath(); cx.arc(x,y,r,0,6.283); cx.fill();
  }
  drawWarp(dt);
  requestAnimationFrame(drawStars);
}
/* z-depth warp layer: always drifts slowly toward camera; GSAP tweens warp.speed in transitions */
let wst=[];
const newW = z => ({ x:Math.random()*2-1, y:(Math.random()*2-1)*.62, z, pz:z });
function initWarp(){ wst=[]; for(let i=0;i<520;i++) wst.push(newW(.05+Math.random()*.95)); }
function drawWarp(dt){
  const sp=warp.speed; if(sp<=0.01) return;
  const w=cv.width, h=cv.height, fx=w*.5, fy=h*.5, F=w*.36;
  const amt=Math.min(1,.1+sp/12);
  cx.lineCap="round";
  for(const s of wst){
    s.pz=s.z; s.z-=sp*dt*0.00022;
    if(s.z<=.03){ Object.assign(s,newW(1)); continue; }
    const x=fx+s.x/s.z*F, y=fy+s.y/s.z*F;
    if(x<-80||x>w+80||y<-80||y>h+80){ Object.assign(s,newW(1)); continue; }
    const px=fx+s.x/s.pz*F, py=fy+s.y/s.pz*F;
    const a=amt*Math.min(1,(1-s.z)*1.3);
    cx.strokeStyle=`rgba(205,245,240,${a.toFixed(3)})`;
    cx.lineWidth=Math.max(.7,(1-s.z)*2.4)*DPR;
    cx.beginPath(); cx.moveTo(px,py); cx.lineTo(x+.01,y); cx.stroke();
  }
}
initWarp();
addEventListener("resize", ()=>{ initStars(); render(0); });
initStars(); requestAnimationFrame(drawStars);

/* ---------- film grain (generated) ---------- */
(function(){ const c=document.createElement("canvas"); c.width=c.height=220; const g=c.getContext("2d"); const im=g.createImageData(220,220);
  for(let i=0;i<im.data.length;i+=4){ const v=Math.random()*255; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; }
  g.putImageData(im,0,0); document.getElementById("grain").style.backgroundImage=`url(${c.toDataURL()})`; })();

/* ---------- rehearsal timer ---------- */
let t0=null;
const timerEl=document.getElementById("timer");
const fmt=s=>{ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
function startTimer(){ if(t0===null) t0=performance.now(); }
function elapsed(){ return t0===null?0:(performance.now()-t0)/1000; }
setInterval(()=>{
  const e=elapsed();
  timerEl.textContent=fmt(e)+" / "+fmt(TOTAL);
  timerEl.classList.toggle("warn", e>=140 && e<TOTAL);
  timerEl.classList.toggle("over", e>=TOTAL);
  updatePresenter(true);
},250);

/* ---------- presenter window ----------
   Direct window reference (BroadcastChannel is unreliable for file:// pages). */
let pw=null;
function openPresenter(){
  pw=window.open("", "spacenormal-presenter", "width=900,height=640");
  if(!pw) return;
  pw.document.open();
  pw.document.write(`<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Presenter — Space-Normal</title>
  <style>body{margin:0;background:#05080b;color:#eef;font-family:${getComputedStyle(document.body).fontFamily};padding:28px 34px}
  .top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #234;padding-bottom:14px}
  #pt{font-size:56px;font-variant-numeric:tabular-nums;font-weight:300}#pt.warn{color:#ffb547}#pt.over{color:#ff4d4d}
  #ps{font-size:18px;color:#8aa;letter-spacing:.1em;text-transform:uppercase}
  #pn{font-size:30px;line-height:1.45;margin-top:22px}#pn .beat{color:#38e1d4}
  #px{margin-top:26px;font-size:18px;color:#789}#pg{font-size:18px;color:#38e1d4;margin-top:6px}
  small{color:#567}</style></head><body>
  <div class="top"><div id="ps"></div><div id="pt">0:00</div></div>
  <div id="pg"></div><div id="pn"></div><div id="px"></div>
  <p><small>→ / PageDown / Space = dalej · ← / PageUp = wstecz · R = reset timera</small></p></body></html>`);
  pw.document.close();
  pw.document.addEventListener("keydown", onKey);
  updatePresenter();
}
function updatePresenter(onlyTime){
  if(!pw || pw.closed) return;
  const d=pw.document, s=S[cur], e=elapsed();
  const pt=d.getElementById("pt"); if(!pt) return;
  pt.textContent=fmt(e)+" / "+fmt(TOTAL);
  pt.className = e>=TOTAL?"over":(e>=140?"warn":"");
  if(onlyTime) return;
  if(!started){ d.getElementById("ps").textContent="Start · czarny ekran"; d.getElementById("pg").textContent="cel: 0:00";
    d.getElementById("pn").innerHTML='<span class="beat">[klik]</span> = intro: planety → zbliżenie → portal z astronautką (ok. 4 s), potem slajd 1.';
    d.getElementById("px").textContent="Następny: "+S[0].title; return; }
  d.getElementById("ps").textContent=`Slajd ${cur+1}/${S.length} · ${s.title} · klik ${beat}/${s.beats}`;
  d.getElementById("pg").textContent= s.time ? `cel: ${fmt(s.time[0])} – ${fmt(s.time[1])}` : "poza czasem (Q&A)";
  d.getElementById("pn").innerHTML=H(s.notes).replace(/\n/g,"<br><br>").replace(/\[klik\]/g,'<span class="beat">[klik]</span>');
  d.getElementById("px").textContent= cur<S.length-1 ? "Następny: "+S[cur+1].title : "Koniec";
}

/* ---------- input ---------- */
function onKey(e){
  const k=e.key;
  if(["ArrowRight"," ","PageDown","Enter"].includes(k)){ e.preventDefault(); next(); }
  else if(["ArrowLeft","PageUp","Backspace"].includes(k)){ e.preventDefault(); prev(); }
  else if(k==="f"||k==="F"){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
  else if(k==="t"||k==="T"){ timerEl.style.display = timerEl.style.display==="block"?"none":"block"; }
  else if(k==="r"||k==="R"){ t0=null; }
  else if(k==="p"||k==="P"){ openPresenter(); }
  else if(/^[1-8]$/.test(k)){ go(+k-1); }
  document.getElementById("hint").style.opacity=0;
}
document.addEventListener("keydown", onKey);
document.addEventListener("click", e=>{ if(e.target.closest("a")) return; next(); document.getElementById("hint").style.opacity=0; });

/* restore position from hash (#slide.beat) */
(function(){
  const m=location.hash.match(/^#(\d+)(?:\.(\d+))?/);
  if(CINE){ G.set(scenes,{autoAlpha:0,scale:1}); G.set(scenes[0],{autoAlpha:1}); G.set($("holo"),{xPercent:-50,yPercent:-50}); }
  const resume = m && !(m[1]==="1" && (m[2]||"0")==="0");   // #1.0 (or no hash) = play intro
  if(resume){ cur=Math.min(S.length-1,Math.max(0,+m[1]-1)); beat=Math.min(S[cur].beats,+(m[2]||0)); }
  if(CINE){ if(resume) finishIntro(); else setPortal(false); }
  else astroLoop();
  shown=-1; render(0); shown=cur;
})();
setTimeout(()=>{ document.getElementById("hint").style.opacity=0; }, 6000);
</script>
