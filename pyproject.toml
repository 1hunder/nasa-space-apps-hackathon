[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spacenormal"
version = "0.1.0"
description = "Adaptation-aware crew health monitoring prototype (NASA Space Apps)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "requests>=2.31",
  "matplotlib>=3.8",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]
llm = ["anthropic>=0.40"]

[tool.hatch.build.targets.wheel]
packages = ["src/spacenormal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
